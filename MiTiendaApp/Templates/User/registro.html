{% extends 'Base.html' %}
{% load crispy_forms_tags %}
{% block title %}Crear cuenta | Gestión de Pedidos{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <span class="eyebrow">NUEVA CUENTA</span>
      <h1>Crea tu cuenta</h1>
      <p class="auth-subtitle">Completa tus datos para registrarte.</p>
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-brand btn-lg btn-block">Crear cuenta</button>
      </form>
      <div class="auth-footer">¿Ya tienes una cuenta? <a href="{% url 'logear' %}">Iniciar sesión</a></div>
    </div>
  </div>
</section>
{% endblock %}
