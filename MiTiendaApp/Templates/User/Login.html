{% extends 'Base.html' %}
{% load crispy_forms_tags %}
{% block title %}Ingresar | Gestión de Pedidos{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="container">
    <div class="auth-card">
      <span class="eyebrow">BIENVENIDO DE NUEVO</span>
      <h1>Inicia sesión</h1>
      <p class="auth-subtitle">Accede a tu cuenta para continuar.</p>
      <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-brand btn-lg btn-block">Ingresar</button>
      </form>
      <div class="auth-footer">¿Aún no tienes cuenta? <a href="{% url 'registrar' %}">Crear cuenta</a></div>
    </div>
  </div>
</section>
{% endblock %}
